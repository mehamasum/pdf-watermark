[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-watermark"
version = "0.1.0"
description = "Burn a non-removable text watermark into PDFs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["Pillow>=9"]

[project.scripts]
pdf-watermark = "pdf_watermark.cli:main"

[tool.setuptools]
packages = ["pdf_watermark"]
